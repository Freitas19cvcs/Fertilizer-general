<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fert CVCS">
<meta name="theme-color" content="#202938">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Fertilizing Schedule CVCS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --orange:#E86010; --orange-lt:#FDEADD; --navy:#202938; --navy-lt:#2c3a4f;
    --paper:#F5F4F0; --card:#FFFFFF; --line:#E3E1DA; --line-lt:#EEECE6;
    --ink:#1C2430; --muted:#6B7280; --faint:#8A8F98; --ghost:#B6B2A7;
    --green:#3F7A3F; --green-lt:#EEF6EE; --green-chip:#DCEFDC; --red:#B3402A;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);
       padding-top:env(safe-area-inset-top)}
  button{font-family:inherit;border:none;cursor:pointer;background:none}
  input{font-family:inherit}
  .tabnum{font-variant-numeric:tabular-nums}

  header{background:var(--navy);position:sticky;top:0;z-index:30}
  .hwrap{max-width:960px;margin:0 auto;padding:12px 16px 0}
  .hrow{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--orange);color:#fff;font-size:26px;font-weight:900;
        display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .htitle{color:#fff;font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
  .hsub{color:#9AA4B2;font-size:11px;margin-top:1px}
  .save{margin-left:auto;font-size:11px;font-weight:700;color:#8FD694;min-width:52px;text-align:right}
  .save.err{color:#FF8F6B}
  .tabs{display:flex;gap:2px;margin-top:10px}
  .tab{padding:10px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
       color:#9AA4B2;border-radius:10px 10px 0 0}
  .tab.on{background:var(--paper);color:var(--orange)}

  main{max-width:960px;margin:0 auto;padding:16px}
  .mstrip{display:flex;gap:6px;overflow-x:auto;padding:14px 16px 4px;max-width:960px;margin:0 auto;
          scrollbar-width:none}
  .mstrip::-webkit-scrollbar{display:none}
  .mpill{padding:9px 13px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:.08em;
         text-transform:uppercase;flex-shrink:0;color:#fff;background:var(--navy);opacity:.85}
  .mpill.dim{background:#E3E1DA;color:#8A8F98;opacity:1}
  .mpill.on{background:var(--orange);opacity:1}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .cnum{font-size:24px;font-weight:900;color:var(--navy)}
  .cnum .sub{font-size:15px;font-weight:700;color:#9AA4B2}
  .cnum.orange{color:var(--orange)}
  .clab{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}

  .secrow{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;gap:10px;flex-wrap:wrap}
  .sechead{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
  .btn{padding:10px 16px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:.08em;
       text-transform:uppercase;color:#fff;background:var(--navy)}
  .btn.orange{background:var(--orange)}
  .btn.ghost{background:#E3E1DA;color:var(--muted)}
  .btn.green{background:var(--green-chip);color:var(--green)}
  .btn.red{background:var(--red)}
  .btn:disabled{background:#C9C6BD}

  .rblock{margin-bottom:16px}
  .rbar{display:flex;align-items:center;gap:10px;background:var(--navy);border-radius:12px 12px 0 0;padding:7px 12px}
  .rchip{width:26px;height:26px;border-radius:7px;background:var(--orange);color:#fff;font-weight:900;font-size:14px;
         display:flex;align-items:center;justify-content:center}
  .rlab{color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .rmeta{margin-left:auto;color:#9AA4B2;font-size:11px;font-weight:700}
  .rbody{border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;background:var(--card)}

  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;
       border-top:1px solid var(--line-lt);background:var(--card)}
  .row:first-child{border-top:none}
  .row.done{background:var(--green-lt)}
  .row.picked{background:var(--orange-lt)}
  .tick{width:22px;height:22px;border-radius:50%;border:2px solid #C9C6BD;flex-shrink:0;display:flex;
        align-items:center;justify-content:center;font-size:11px;font-weight:900;color:transparent}
  .tick.sq{border-radius:6px}
  .tick.on{border-color:var(--green);background:var(--green);color:#fff}
  .tick.on.orange{border-color:var(--orange);background:var(--orange)}
  .rmain{min-width:0;flex:1}
  .rname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rname.done{color:var(--green);text-decoration:line-through}
  .rsub{font-size:11px;color:var(--faint);margin-top:1px}
  .chips{display:flex;gap:5px;flex-shrink:0}
  .chip{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
  .chip.lawn{background:var(--orange-lt);color:#B05A10}
  .chip.bed{background:#EEF1F6;color:var(--navy)}
  .chip.tree{background:#F3EEE6;color:var(--muted)}
  .chip.done{background:var(--green-chip);color:var(--green)}

  .expand{padding:6px 12px 12px;border-top:1px dashed var(--line);display:grid;gap:8px;background:inherit}
  .logline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FBFAF7;border:1px solid var(--line-lt);
           border-radius:10px;padding:9px 12px}
  .logline.done{background:var(--green-lt);border-color:var(--green-chip)}
  .loglab{font-size:12px;font-weight:700;color:var(--navy);flex:1;min-width:140px}
  .loglab.g{color:var(--green)}
  .step{display:flex;align-items:center;gap:5px}
  .sbtn{width:34px;height:34px;border-radius:9px;background:#E3E1DA;color:var(--navy);font-size:19px;font-weight:900}
  .sval{width:42px;text-align:center;font-weight:900;font-size:15px;color:var(--orange)}

  .empty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px;text-align:center}
  .empty b{font-size:16px;color:var(--navy)}
  .empty p{font-size:13px;color:var(--muted);margin-top:5px}

  .orow{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--line-lt)}
  .orow:first-child{border-top:none}
  .ototal{display:flex;justify-content:space-between;align-items:center;padding:13px 12px;background:var(--orange-lt);
          font-weight:800}
  .note{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.5}

  .search{flex:1;padding:11px 13px;border-radius:10px;border:1px solid #D8D5CC;font-size:14px;font-weight:600;
          outline:none;background:var(--card);color:var(--ink)}
  .astep{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .aslab{font-size:9px;font-weight:800;text-transform:uppercase;color:var(--faint);width:32px;text-align:right}
  .asbtn{width:30px;height:30px;border-radius:8px;background:#E3E1DA;color:var(--navy);font-weight:900;font-size:16px}
  .asval{width:34px;text-align:center;font-weight:900;font-size:13px;color:var(--navy);position:relative}
  .dot{position:absolute;top:-2px;right:-1px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
  .nolabel{font-size:11px;font-weight:600;color:var(--ghost);width:104px;text-align:center;flex-shrink:0}

  .toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .datein{padding:9px 11px;border-radius:10px;border:1px solid #D8D5CC;font-size:13px;background:var(--card)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:14px;
         display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ptitle{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--navy)}
  .psub{font-size:11px;color:var(--faint);margin-top:2px}


  .exrow{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
  .chip.x{background:#EDE4F5;color:#5B3E86}
  .langbar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .lbtn{padding:8px 13px;border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.06em;
        text-transform:uppercase;background:#E3E1DA;color:var(--muted)}
  .lbtn.on{background:var(--green);color:#fff}
  .stepwrap{margin:-2px 0 4px}
  .steps{background:#FBFAF7;border:1px solid var(--line-lt);border-radius:10px;padding:11px 12px}
  .stepitem{display:flex;gap:9px;padding:5px 0;border-top:1px solid var(--line-lt)}
  .stepitem:first-child{border-top:none;padding-top:0}
  .stepno{width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;
          font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .steptext{font-size:12.5px;line-height:1.45}
  .sen{display:block;color:var(--ink)}
  .ses{display:block;color:var(--muted);font-style:italic;margin-top:2px}
  .safety{margin-top:9px;padding:9px 10px;background:var(--orange-lt);border-radius:8px;font-size:11.5px;
          line-height:1.45;color:#7a3d0a}
  .safety b{letter-spacing:.06em}
  .pprice{display:block;font-weight:900;font-size:14px;color:var(--navy)}
  .editbtn{padding:7px 12px;border-radius:8px;background:#EEF1F6;color:var(--navy);font-size:11px;
           font-weight:800;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0}
  .btn.green2{background:var(--green)}
  .tagnew{background:var(--green-chip);color:var(--green);font-size:9px;font-weight:800;padding:2px 6px;
          border-radius:5px;letter-spacing:.06em;vertical-align:middle}
  .modalwrap{position:fixed;inset:0;background:rgba(20,26,36,.62);z-index:60;display:flex;
             align-items:flex-end;justify-content:center;padding:0}
  .modal{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;
         display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
  .mhead{display:flex;align-items:center;padding:16px 18px;background:var(--navy);border-radius:18px 18px 0 0;
         color:#fff;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
  .xbtn{margin-left:auto;color:#9AA4B2;font-size:20px;font-weight:700;padding:0 4px}
  .mbody{padding:16px 18px;overflow-y:auto}
  .mfoot{display:flex;gap:8px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);
         background:#FBFAF7;border-radius:0 0 0 0;flex-wrap:wrap;
         padding-bottom:calc(13px + env(safe-area-inset-bottom))}
  .fl{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      color:var(--muted);margin:12px 0 5px}
  .mbody .fl:first-child{margin-top:0}
  .fi{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #D8D5CC;font-size:15px;
      background:#fff;color:var(--ink);outline:none;-webkit-appearance:none}
  .fi:focus{border-color:var(--green)}
  .frow{display:flex;gap:10px}
  .frow>div{flex:1;min-width:0}
  .fhint{font-size:11px;color:var(--faint);margin-top:6px;line-height:1.45}
  .fchk{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:14px;font-weight:600;color:var(--ink)}
  .fchk input{width:20px;height:20px;accent-color:var(--green)}
  @media(max-width:640px){.cards{grid-template-columns:repeat(3,1fr)}.cnum{font-size:19px}}
</style>
</head>

78 Miles Ct, Merced"}],"grassCal":{"D":{"February":"DIM","April":"SG","June":"CONV","August":"PROD","October":"SG","December":"WINTER"},"B":{"February":"DIM","May":"SURGE","August":"PROD","November":"WINTER"},"A":{"February":"DIM","June":"SURGE","October":"WINTER"},"C":{"February":"DIM","June":"SURGE","October":"WINTER"},"MCD":{"February":"DIM","August":"PROD"},"GOLF":{},"OUT":{}},"bedCal":{"D":{"February":"TI","April":"TEN","August":"TEN","October":"TI"},"B":{"February":"TI","April":"TEN","August":"TEN","October":"TI"},"GOLF":{"February":"TI","April":"TEN","August":"TEN","October":"TI"},"MCD":{"February":"TI","May":"TEN","October":"TI"},"A":{"May":"TEN","October":"TI"},"C":{},"OUT":{}},"treeCal":{"April":"APHID","October":"DEEP"},"catalog":{"DIM":{"name":"21-0-10 w/ Dimension","unit":"50 lb bag","price":38.99,"kind":"lawn","rate":5.0,"rateUnit":"lbs","unitSize":50,"use":"Lawn fertilizer + crabgrass pre-emergent","steps":{"en":["Mow first and blow the clippings off all concrete before you spread.","Lawn must be DRY when you spread. Check that heavy rain isn't coming in the next few hours.","Set the spreader to 5 lbs per 1,000 sq ft. Check the setting on the bag before the first pass.","Spread a header strip around the whole edge first, then fill the middle in straight passes, overlapping the wheel tracks slightly.","Shut the spreader OFF when you turn, and when you cross sidewalks, driveways or rock.","Blow every granule off concrete, gutters and drains back onto the grass.","Water in about 1/2 inch. The pre-emergent does NOTHING until it is watered in — tell the customer if their timer is off.","Do not aerate, dethatch or rototill after — it breaks the weed barrier.","Log the bags you actually used in the app before you leave the property."],"es":["Corte el césped primero y sople los recortes de todo el concreto antes de esparcir.","El césped debe estar SECO al esparcir. Verifique que no venga lluvia fuerte en las próximas horas.","Ajuste la esparcidora a 5 libras por cada 1,000 pies cuadrados. Revise el ajuste en la bolsa antes de empezar.","Primero haga una vuelta por toda la orilla, luego llene el centro en pasadas rectas, traslapando un poco las huellas.","APAGUE la esparcidora al dar vuelta y al cruzar banquetas, entradas o piedra.","Sople todos los gránulos del concreto, cunetas y drenajes de regreso al césped.","Riegue con media pulgada de agua. El pre-emergente NO SIRVE hasta que se riega — avise si el timer no funciona.","No aire, no escarifique ni remueva la tierra después — rompe la barrera contra maleza.","Apunte en la aplicación las bolsas que realmente usó antes de salir de la propiedad."]},"cat":"FERT"},"SURGE":{"name":"21-3-5 w/ Surge","unit":"50 lb bag","price":44.33,"kind":"lawn","rate":4.5,"rateUnit":"lbs","unitSize":50,"use":"Lawn fertilizer + post-emergent","steps":{"en":["This one kills weeds that are already up, so the weeds must be actively growing — not burnt or dormant.","Apply when the grass blades are slightly DAMP (early morning dew is perfect). The granules need to stick to the leaf.","Set the spreader to 4.5 lbs per 1,000 sq ft.","Header strip, then straight overlapping passes.","Spreader off on turns and hard surfaces; blow concrete clean.","Do NOT water for 24 to 48 hours after — watering washes the weed killer off the leaf before it works.","Tell the customer to hold their irrigation a day, or shut the timer off yourself and note it.","Do not mow for 2 to 3 days after.","Log the bags used before you leave."],"es":["Este mata la maleza que ya salió, así que la maleza debe estar creciendo — no quemada ni dormida.","Aplique cuando las hojas del pasto estén un poco HÚMEDAS (el rocío de la mañana es perfecto). El gránulo tiene que pegarse a la hoja.","Ajuste la esparcidora a 4.5 libras por cada 1,000 pies cuadrados.","Primero la orilla, luego pasadas rectas traslapadas.","Apague la esparcidora en vueltas y concreto; sople el concreto limpio.","NO riegue por 24 a 48 horas — el agua lava el herbicida de la hoja antes de que trabaje.","Dígale al cliente que detenga el riego un día, o apague el timer usted y apúntelo.","No corte el césped por 2 o 3 días después.","Apunte las bolsas usadas antes de salir."]},"cat":"FERT"},"PROD":{"name":"24-0-4 w/ Prodiamine","unit":"50 lb bag","price":33.23,"kind":"lawn","rate":4.0,"rateUnit":"lbs","unitSize":50,"use":"Lawn fertilizer + pre-emergent","steps":{"en":["Same spread job as February, but this one goes down in the heat — start early in the morning.","Lawn must be dry. Never spread on wet or stressed, drought-dry grass.","Set the spreader to 4 lbs per 1,000 sq ft.","Header strip around the edges first, then straight overlapping passes through the middle.","Spreader OFF on turns and over all hard surfaces.","Blow all granules off concrete and away from drains.","Water in about 1/2 inch right away — in summer heat, unwatered granules can burn the lawn.","Log the bags used before you leave."],"es":["El mismo trabajo que en febrero, pero este va en el calor — empiece temprano en la mañana.","El césped debe estar seco. Nunca esparza sobre pasto mojado o muy reseco y estresado.","Ajuste la esparcidora a 4 libras por cada 1,000 pies cuadrados.","Primero la orilla, luego pasadas rectas traslapadas por el centro.","APAGUE la esparcidora en las vueltas y sobre todo el concreto.","Sople todos los gránulos del concreto y lejos de los drenajes.","Riegue media pulgada de inmediato — en el calor los gránulos sin agua queman el césped.","Apunte las bolsas usadas antes de salir."]},"cat":"FERT"},"WINTER":{"name":"22-5-5 w/ Fe","unit":"50 lb bag","price":32.17,"kind":"lawn","rate":4.5,"rateUnit":"lbs","unitSize":50,"use":"Winter lawn fertilizer","steps":{"en":["Winter feed — goes down before the cold so the roots store food. Grass should still be green.","Lawn dry, no rain in the next few hours.","Set the spreader to 4.5 lbs per 1,000 sq ft.","Header strip, then straight overlapping passes.","This one has IRON — iron STAINS concrete rust orange. Keep the spreader closed over every hard surface and blow concrete immediately, before any water hits it.","Water in about 1/2 inch after the concrete is clean.","Log the bags used before you leave."],"es":["Alimento de invierno — va antes del frío para que la raíz guarde comida. El pasto debe estar todavía verde.","Césped seco, sin lluvia en las próximas horas.","Ajuste la esparcidora a 4.5 libras por cada 1,000 pies cuadrados.","Primero la orilla, luego pasadas rectas traslapadas.","Este trae HIERRO — el hierro MANCHA el concreto color óxido. Mantenga la esparcidora cerrada sobre todo el concreto y sople de inmediato, antes de que le caiga agua.","Riegue media pulgada después de limpiar el concreto.","Apunte las bolsas usadas antes de salir."]},"cat":"FERT"},"SG":{"name":"Supreme Green (liquid)","unit":"2.5 gal jug","price":67.75,"kind":"lawn-liquid","rate":6.0,"rateUnit":"oz","unitSize":320,"use":"Liquid lawn fertilizer","steps":{"en":["Liquid feed — mixes and sprays. Wear gloves and eye protection.","Mix at 6 oz per 1,000 sq ft in the tank or hose-end jar. Shake or agitate before and during.","Spray early morning or evening. Do NOT spray over 90 degrees or in wind — it drifts onto cars and windows.","Walk an even pace, overlap each pass slightly, keep the wand at a steady height.","Watch for skips — liquid stripes show up green in a week.","Rinse the tank and wand out at the shop when you're done.","Log the jugs used before you leave."],"es":["Alimento líquido — se mezcla y se rocía. Use guantes y protección para los ojos.","Mezcle 6 onzas por cada 1,000 pies cuadrados en el tanque o el frasco de manguera. Agite antes y durante.","Rocíe temprano en la mañana o en la tarde. NO rocíe arriba de 90 grados ni con viento — se va a los carros y ventanas.","Camine a paso parejo, traslape cada pasada un poco, mantenga la vara a la misma altura.","Cuidado con los brincos — las rayas del líquido se ven verdes en una semana.","Enjuague el tanque y la vara en el taller cuando termine.","Apunte los galones usados antes de salir."]},"cat":"FERT"},"CONV":{"name":"Converge 18-3-6 (liquid)","unit":"2.5 gal jug","price":74.88,"kind":"lawn-liquid","rate":8.0,"rateUnit":"oz","unitSize":320,"use":"Liquid lawn fertilizer","steps":{"en":["Liquid feed — same job as Supreme Green, heavier rate. Gloves and eye protection.","Mix at 8 oz per 1,000 sq ft. Agitate before and during the application.","Early morning or evening only. No spraying in wind or over 90 degrees.","Even pace, slight overlap on every pass, wand at a steady height.","Keep spray off sidewalks, cars, and building glass.","Rinse the tank and wand at the shop.","Log the jugs used before you leave."],"es":["Alimento líquido — el mismo trabajo que Supreme Green, con más dosis. Guantes y protección para los ojos.","Mezcle 8 onzas por cada 1,000 pies cuadrados. Agite antes y durante la aplicación.","Solo temprano en la mañana o en la tarde. No rocíe con viento ni arriba de 90 grados.","Paso parejo, traslape cada pasada, vara a la misma altura.","Mantenga el rocío fuera de banquetas, carros y vidrios del edificio.","Enjuague el tanque y la vara en el taller.","Apunte los galones usados antes de salir."]},"cat":"FERT"},"TEN":{"name":"10-10-10 w/ 10% Fe","unit":"50 lb bag","price":30.49,"kind":"bed","rate":5.0,"rateUnit":"lbs","unitSize":50,"use":"Flower bed / shrub fertilizer","steps":{"en":["Flower bed and shrub food. Pull any big weeds out of the bed first.","Spread by hand or hand spreader at 5 lbs per 1,000 sq ft, evenly across the bed.","Keep granules OFF the leaves and out of the crown of the plant — brush any off that land on foliage.","Stay about 6 inches away from the trunk or stem of each shrub.","Scratch it lightly into the top of the mulch or soil where you can.","Water the bed in well after.","Blow granules off any concrete or pathways.","Log the bags used before you leave."],"es":["Alimento para jardineras y arbustos. Primero saque la maleza grande de la jardinera.","Esparza a mano o con esparcidora de mano, 5 libras por cada 1,000 pies cuadrados, parejo en toda la jardinera.","Mantenga los gránulos FUERA de las hojas y del centro de la planta — sacuda los que caigan en el follaje.","Quédese como 6 pulgadas lejos del tronco o tallo de cada arbusto.","Rástrillelo ligeramente en la capa de mulch o tierra donde se pueda.","Riegue bien la jardinera después.","Sople los gránulos del concreto y las banquetas.","Apunte las bolsas usadas antes de salir."]},"cat":"FERT"},"TI":{"name":"T/I 2.5G (bed pre-em)","unit":"50 lb bag","price":105.74,"kind":"bed","rate":3.5,"rateUnit":"lbs","unitSize":50,"use":"Flower bed pre-emergent","steps":{"en":["Bed pre-emergent — this stops weed seed from sprouting. It does NOT kill weeds that are already there.","Weed the bed CLEAN first. Anything you leave keeps growing.","Rake or fluff the mulch smooth before you spread.","Spread at 3.5 lbs per 1,000 sq ft, evenly over the whole bed surface.","Keep it off the leaves; stay off any bed where the customer is about to plant seed or new flowers.","Water in about 1/2 inch — it does not activate until watered.","Do NOT disturb the soil after. No cultivating, no digging, no raking — that breaks the barrier.","Log the bags used before you leave."],"es":["Pre-emergente para jardineras — evita que la semilla de maleza brote. NO mata la maleza que ya está.","Primero limpie la jardinera de maleza. Lo que deje va a seguir creciendo.","Rastrille o empareje el mulch antes de esparcir.","Esparza 3.5 libras por cada 1,000 pies cuadrados, parejo en toda la jardinera.","Manténgalo fuera de las hojas; no lo use donde el cliente va a sembrar semilla o flores nuevas.","Riegue media pulgada — no se activa hasta que se riega.","NO mueva la tierra después. No cultive, no escarbe, no rastrille — eso rompe la barrera.","Apunte las bolsas usadas antes de salir."]},"cat":"PRE"},"APHID":{"name":"Tree aphid systemic (product TBD)","unit":"TBD","price":0.0,"kind":"tree","rate":0,"rateUnit":"","unitSize":0,"use":"Systemic drench — aphids & scale","steps":{"en":["Systemic drench for aphids and scale — the tree drinks it up through the roots. Gloves and eye protection required.","Water the soil around the tree FIRST so the ground is moist and will take the drench.","Rake mulch back from the base to expose bare soil in a ring at the dripline.","Mix per the label for the trunk size — measure the trunk diameter, don't guess.","Pour slowly in a ring around the trunk out toward the dripline so it soaks in instead of running off.","Do NOT let it run onto concrete, into gutters, or anywhere near a storm drain or ditch.","Rake the mulch back over when the soil has taken it.","Never apply while the tree is in bloom — bees.","Note the date and the tree in the app; this holds for the season."],"es":["Aplicación al suelo para pulgón y escama — el árbol lo toma por la raíz. Se requieren guantes y protección para los ojos.","PRIMERO riegue la tierra alrededor del árbol para que esté húmeda y acepte el producto.","Retire el mulch de la base para dejar tierra descubierta en un círculo hasta la orilla de la copa.","Mezcle según la etiqueta para el grueso del tronco — mida el diámetro, no adivine.","Vierta despacio en círculo alrededor del tronco hacia la orilla de la copa para que se absorba y no escurra.","NO deje que escurra al concreto, a las cunetas, ni cerca de un drenaje o zanja.","Vuelva a poner el mulch cuando la tierra lo haya absorbido.","Nunca aplique cuando el árbol está en flor — por las abejas.","Apunte la fecha y el árbol en la aplicación; esto dura toda la temporada."]},"cat":"TREE"},"DEEP":{"name":"Tree deep-root feed (product TBD)","unit":"TBD","price":0.0,"kind":"tree","rate":0,"rateUnit":"","unitSize":0,"use":"Deep-root tree fertilization","steps":{"en":["Deep-root feeding — food goes below the grass roots where the tree feeds.","Water the area first if the soil is hard and dry.","Work in a grid around the tree from about 3 feet off the trunk out t tSize":40,"use":"Dry-spot rescue — pulls soil moisture vapor back to the roots, lasts up to 3 months","steps":{"en":["For dry spots and drought-stressed lawns — it grabs moisture vapor in the soil and turns it back into water the roots can drink. One application holds up to 3 months.","Spread at 2.7 lbs per 1,000 sq ft with any spreader — whole lawn, or just the dry areas plus a wide ring around them.","Safe around kids and pets; no re-entry wait.","Water in with about 1/4 to 1/2 inch right after — it has to reach the root zone to work.","It is NOT a fix for a broken sprinkler — if a zone is dead, tell Michael. This buys time; it doesn't replace water.","Also works in flower beds and around trees on the same rate.","Log the bags used and which properties got it."],"es":["Para áreas secas y césped estresado por sequía — agarra el vapor de humedad de la tierra y lo vuelve agua que la raíz puede tomar. Una aplicación dura hasta 3 meses.","Esparza 2.7 libras por cada 1,000 pies cuadrados con cualquier esparcidora — todo el césped, o solo las áreas secas más un anillo ancho alrededor.","Seguro con niños y mascotas; no hay que esperar para entrar.","Riegue de 1/4 a 1/2 pulgada de inmediato — tiene que llegar a la raíz para trabajar.","NO arregla un aspersor descompuesto — si una zona está muerta, dígale a Michael. Esto da tiempo; no reemplaza el agua.","También sirve en jardineras y alrededor de árboles con la misma dosis.","Apunte las bolsas usadas y cuáles propiedades lo recibieron."]}}},"safety":{"en":"ALWAYS: gloves, eye protection, long pants, closed shoes. Wash hands before you eat or smoke. Keep people and pets off the area until it is watered in and dry. Every application is made under the CVCS DPR license — if anything looks wrong, STOP and call Michael at (209) 678-3079.","es":"SIEMPRE: guantes, protección para los ojos, pantalón largo, zapatos cerrados. Lávese las manos antes de comer o fumar. No deje que entre gente ni mascotas hasta que se riegue y seque. Tod async function loadStore(){
  let v=null;
  if(window.storage&&window.storage.get){ try{const r=await window.storage.get(KEY); if(r) v=r.value;}catch(e){} }
  if(v===null){ try{v=localStorage.getItem(KEY);}catch(e){} }
  try{S=v?JSON.parse(v):null;}catch(e){S=null;}
  if(!S) S={baselines:{},logs:{},purchases:[],assignments:{},custom:[],edits:{},prodEdits:{},prodCustom:[],docs:[],monthMods:{}};
  S.baselines=S.baselines||{}; S.logs=S.logs||{}; S.purchases=S.purchases||[]; S.assignments=S.assignments||{}; S.custom=S.custom||[]; S.edits=S.edits||{}; S.prodEdits=S.prodEdits||{}; S.prodCustom=S.prodCustom||[]; S.docs=S.docs||[]; S.monthMods=S.monthMods||{};
}
async function save(){
  const s=JSON.stringify(S); let ok=false;
  try{localStorage.setItem(KEY,s); ok=true;}catch(e){}
  if(window.storage&&window.storage.set){ try{await window.storage.set(KEY,s); ok=true;}catch(e){} }
  saveState=ok?"saved":"err";
  render();
  setTimeout(()=>{saveState="";render();},1400);
}

const TIERS=["MCD","A","B","C","D","GOLF"];
const TIERDESC={MCD:"Restaurant — grass 2x · shrubs 3x · trees 2x",A:"Standard — grass 3x · shrubs 2x · trees 2x",
  B:"Enhanced — grass 4x · shrubs 4x · trees 2x",C:"Turf only — grass 3x",
  D:"Premium — grass bi-monthly · shrubs 4x · trees 2x",GOLF:"Ornamental only — shrubs 4x · trees 2x"};
const WDAYS=["Monday","Tuesday","Wednesday","Thursday","Friday"];

function ACC(){
  const list=DATA.accounts.concat(S.custom||[]);
  return list.map(a=>{
    const e=(S.edits||{})[a.id];
    return e?Object.assign({},a,e):a;
  }).filter(a=>!a.removed);
}
function findAcc(id){return ACC().find(a=>a.id===id);}

function working(id){
  const a=findAcc(id); if(!a) return {lawn:0,bed:0};
  return {lawn:(S.baselines[id]&&S.baselines[id].lawn!==undefined)?S.baselines[id].lawn:a.lawn,
          bed:(S.baselines[id]&&S.baselines[id].bed!==undefined)?S.baselines[id].bed:a.bed};
}
function planFor(m){
  const rows=[];
  const key=year+"-"+m, mods=S.monthMods[key]||{};
  for(const a of ACC()){
    let g=a.lawn>0?(DATA.grassCal[a.tier]||{})[m]:null;
    let b=a.bed>0?(DATA.bedCal[a.tier]||{})[m]:null;
    const t=a.trees?DATA.treeCal[m]:null;
    const mod=mods[a.id];
    if(mod){ if(g&&mod.lawn) g=mod.lawn; if(b&&mod.bed) b=mod.bed; }
    const x=(mod&&mod.extras)?mod.extras:[];
    if(g||b||t||x.length) rows.push({a,g,b,t,x});
  }
  rows.sort((x,y)=>RO[x.a.route]-RO[y.a.route]||DO[x.a.day]-DO[y.a.day]||x.a.id.localeCompare(y.a.id));
  return rows;
}
const lk=(id,kind)=>year+"-"+month+"-"+id+"-"+kind;
function status(row){
  const parts=[]; if(row.g)parts.push("lawn"); if(row.b)parts.push("bed");
  if(row.x) row.x.forEach((_,i)=>parts.push("x"+i));
  if(row.t)parts.push("tree");
  const done=parts.filter(k=>S.logs[lk(row.a.id,k)]&&S.logs[lk(row.a.id,k)].done);
  return {parts,done,complete:parts.length>0&&done.length===parts.length};
}
function monthTotals(m){
  const t={};
  const key=year+"-"+m, mods=S.monthMods[key]||{};
  for(const a of ACC()){
    const w=working(a.id);
    let g=a.lawn>0?(DATA.grassCal[a.tier]||{})[m]:null;
    let b=a.bed>0?(DATA.bedCal[a.tier]||{})[m]:null;
    const mod=mods[a.id];
    if(mod){ if(g&&mod.lawn) g=mod.lawn; if(b&&mod.bed) b=mod.bed; }
    if(g){const log=S.logs[key+"-"+a.id+"-lawn"]; t[g]=(t[g]||0)+(log&&log.done?log.actual:w.lawn);}
    if(b){const log=S.logs[key+"-"+a.id+"-bed"]; t[b]=(t[b]||0)+(log&&log.done?log.actual:w.bed);}
    if(mod&&mod.extras) mod.extras.forEach((x,i)=>{
      const log=S.logs[key+"-"+a.id+"-x"+i];
      t[x.code]=(t[x.code]||0)+(log&&log.done?log.actual:x.qty);
    });
  }
  return t;
}
function orderRows(m){
  const tot=monthTotals(m);
  return Object.entries(tot).map(([code,bags])=>{
    const p=P(code);
    const units=JUG[code]?Math.ceil(bags*JUG[code]-1e-9):Math.ceil(bags-1e-9);
    const purchased=S.purchases.filter(x=>x.code===code&&x.month===m&&x.year===year).reduce((s,x)=>s+x.qty,0);
    return {code,name:p.name,unit:p.unit,price:p.price,bags,units,cost:units*p.price,purchased};
  }).sort((a,b)=>b.cost-a.cost);
}

const juanDate=()=>((S.assignments[jKey()]||{}).date)||"";
const juanDays=()=>((S.assignments[jKey()]||{}).days)||{};
const JDAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
const q=v=>v===0.5?"½":v===0.25?"¼":""+v;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

async function logApp(id,kind,actual){
  S.logs[lk(id,kind)]={done:true,actual:actual,date:new Date().toISOString().slice(0,10)};
  if(kind==="lawn"||kind==="bed") S.baselines[id]=Object.assign({},S.baselines[id]||{},{[kind]:actual});

async function toggleJuan(id){

function val(id){const e=document.getElementById(id);return e?e.value:"";}

async function saveAccount(){
  const name=val("f_name").trim();
  if(!name){alert("Give the account a name.");return;}
  const rec={name:name, addr:val("f_addr").trim(), route:val("f_route"), day:val("f_day"),
             tier:val("f_tier"), lawn:parseFloat(val("f_lawn"))||0, bed:parseFloat(val("f_bed"))||0,
             trees:chk("f_trees")};
  if(editing.isNew){
    rec.id="X-"+Date.now();
    S.custom.push(rec);
  }else{
    const isBuiltIn=DATA.accounts.some(a=>a.id===editing.id);
    if(isBuiltIn){ S.edits[editing.id]=Object.assign({},S.edits[editing.id]||{},rec); }
    else{ const i=S.custom.findIndex(a=>a.id===editing.id); if(i>=0) S.custom[i]=Object.assign({},S.custom[i],rec); }
    // clear learned overrides so the new numbers take effect
    if(S.baselines[editing.id]) delete S.baselines[editing.id];
  }
  editing=null; await save();
}
async function deleteAccount(id){
  const isBuiltIn=DATA.accounts.some(a=>a.id===id);
  if(isBuiltIn){ S.edits[id]=Object.assign({},S.edits[id]||{},{removed:true}); }
  else{ S.custom=S.custom.filter(a=>a.id!==id); }
  delete S.baselines[id];
  Object.keys(S.assignments).forEach(k=>{
    const g=S.assignments[k];
    if(g&&g.ids){ g.ids=g.ids.filter(x=>x!==id); if(g.days) delete g.days[id]; }
  });
  editing=null; confirmDel=false; await save();
}
async function restoreRemoved(id){ if(S.edits[id]) delete S.edits[id].removed; await save(); }
function backup(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="cvcs-fert-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function restore(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=async e=>{
    try{
      const txt=await e.target.files[0].text(); const d=JSON.parse(txt);
      if(!d||typeof d!=="object") throw 0;
      S={baselines:d.baselines||{},logs:d.logs||{},purchases:d.purchases||[],assignments:d.assignments||{},custom:d.custom||[],edits:d.edits||{},prodEdits:d.prodEdits||{},prodCustom:d.prodCustom||[],docs:d.docs||[],monthMods:d.monthMods||{}};
      await save(); alert("Backup restored.");
    }catch(err){alert("That file didn't look like a CVCS backup.");}
  };
  inp.click();
}

function cellTxt(main,extras){
  let s=main;
  (extras||[]).forEach(x=>{s+=(s?"\n":"")+"+ "+P(x.code).name+" x "+q(x.qty)+(x.note?" ("+x.note+")":"");});
  return s||"—";
}

function juanPDF(){
  const ids=juanIds(); const all=planFor(month).filter(r=>ids.includes(r.a.id));
  if(!all.length) return;
  const days=juanDays();
  const codeSet={};
  all.forEach(r=>{if(r.g)codeSet[r.g]=1;if(r.b)codeSet[r.b]=1;if(r.t)codeSet[r.t]=1;
    (r.x||[]).forEach(x=>{codeSet[x.code]=1;});});
  const snap={groups:JDAYS.map(d=>({day:d,rows:all.filter(r=>days[r.a.id]===d)}))
      .concat([{day:"UNSCHEDULED",rows:all.filter(r=>!days[r.a.id])}])
      .filter(g=>g.rows.length)
      .map(g=>{
        const load={};
        g.rows.forEach(r=>{const w=working(r.a.id);
          if(r.g)load[r.g]=(load[r.g]||0)+w.lawn; if(r.b)load[r.b]=(load[r.b]||0)+w.bed;
          (r.x||[]).forEach(x=>{load[x.code]=(load[x.code]||0)+x.qty;});});
        return {day:g.day,
          rows:g.rows.map(r=>{const w=working(r.a.id);return{
            name:r.a.name,addr:r.a.addr,mows:r.a.day.slice(0,3),
            lawn:r.g?cellTxt(P(r.g).name+" x "+q(w.lawn),r.x):cellTxt("",r.x),
            bed:r.b?P(r.b).name+" x "+q(w.bed):"—",
            tree:r.t?(r.t==="APHID"?"Aphid":"Deep-root"):"—"};}),
          load:Object.keys(load).map(c=>P(c).name+": "+Math.ceil(load[c]-1e-9)+" bags").join("   ·   ")};
      }),
    codes:Object.keys(codeSet)};
  buildJuanPDF(snap,month,year,juanDate(),false);
  archive("juan","Juan's route — "+month,{stops:all.length,weekOf:juanDate()},snap);
}

/* ═══════════ RENDER ═══════════ */
function chip(cls,txt){return '<span class="chip '+cls+'">'+txt+"</span>";}
function render(){
  if(!S){document.getElementById("app").innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="text-align:center"><div class="logo" style="margin:0 auto">F</div><p style="margin-top:10px;font-weight:700;color:#202938;font-size:14px">Loading your schedule…</p></div></div>';return;}
  const rows=planFor(month), oR=orderRows(month);
  const doneCount=rows.filter(r=>status(r).complete).length;
  const monthCost=oR.reduce((s,r)=>s+r.cost,0);
  const activeM=MONTHS.filter(m=>planFor(m).length>0);
  let h="";

  /* header */
  h+='<header><div class="hwrap"><div class="hrow"><div class="logo">F</div><div>'+
     '<div class="htitle">Fertilizing Schedule CVCS</div>'+
     '<div class="hsub">'+ACC().length+' enrolled properties · baselines learn from actual usage</div></div>'+
     '<div class="save'+(saveState==="err"?" err":"")+'">'+(saveState==="saved"?"Saved ✓":saveState==="err"?"Save failed":"")+'</div></div>'+
     '<div class="tabs">'+[["schedule","Schedule"],["order","Order"],["juan","Juan Route"],["accounts","Accounts"],["library","Library"],["history","History"]]
       .map(([k,l])=>'<button class="tab'+(tab===k?" on":"")+'" onclick="setTab(\''+k+'\')">'+l+"</button>").join("")+
     "</div></div></header>";

  /* month strip */
  h+='<div class="mstrip">'+MONTHS.map(m=>
    '<button class="mpill'+(m===month?" on":activeM.includes(m)?"":" dim")+'" onclick="setMonth(\''+m+'\')">'+m.slice(0,3)+"</button>").join("")+"</div>";

  h+="<main>";

  /* ── SCHEDULE ── */
  if(tab==="schedule"){
    if(!rows.length){
      h+='<div class="empty"><b>No applications in '+month+'.</b><p>Use this month to order ahead — check the Order tab for the next application month.</p></div>';
    }else{
      h+='<div class="cards">'+
        '<div class="card"><div class="cnum orange tabnum">'+doneCount+'<span class="sub">/'+rows.length+'</span></div><div class="clab">Properties done</div></div>'+
        '<div class="card"><div class="cnum tabnum">'+oR.reduce((s,r)=>s+r.units,0)+'</div><div class="clab">Bags & jugs</div></div>'+
        '<div class="card"><div class="cnum tabnum">$'+monthCost.toLocaleString(undefined,{maximumFractionDigits:0})+'</div><div class="clab">Est materials</div></div></div>';
      h+='<div class="secrow"><span class="sechead">'+month+' — tap a property to log it</span>'+
         '<button class="btn" onclick="monthPDF()">PDF — month schedule</button></div>';
      h+=langToggle();
      for(const rt of["A","B","C","D"]){
        const rr=rows.filter(r=>r.a.route===rt); if(!rr.length)continue;
        h+='<div class="rblock"><div class="rbar"><span class="rchip">'+rt+'</span><span class="rlab">Route '+rt+' · '+rr.length+' stops</span></div><div class="rbody">';
        for(const row of rr){
          const st=status(row), open=expanded===row.a.id, w=working(row.a.id);
          const lawnLog=S.logs[lk(row.a.id,"lawn")], bedLog=S.logs[lk(row.a.id,"bed")], treeLog=S.logs[lk(row.a.id,"tree")];
          h+='<div'+(st.complete?' class="done" style="background:var(--green-lt)"':'')+'>';
          h+='<button class="row'+(st.complete?" done":"")+'" onclick="toggleExpand(\''+row.a.id+'\')">'+
             '<span class="tick'+(st.complete?" on":"")+'">✓</span>'+
             '<span class="rmain"><span class="rname'+(st.complete?" done":"")+'">'+esc(row.a.name)+'</span>'+
             '<span class="rsub">mows '+row.a.day.slice(0,3)+' · Tier '+row.a.tier+'</span></span><span class="chips">'+
             (row.g?chip(st.done.includes("lawn")?"done":"lawn",row.g+" ×"+q(lawnLog&&lawnLog.done?lawnLog.actual:w.lawn)):"")+
             (row.b?chip(st.done.includes("bed")?"done":"bed",row.b+" ×"+q(bedLog&&bedLog.done?bedLog.actual:w.bed)):"")+
             (row.x&&row.x.length?chip("x","+"+row.x.length+" extra"):"")+
             (row.t?chip(st.done.includes("tree")?"done":"tree",row.t==="APHID"?"Aphid":"Deep-root"):"")+
             "</span></button>";
          if(open){
            h+='<div class="expand">';
            if(row.g) h+=logLine(row.a.id,"lawn","Lawn — "+P(row.g).name,w.lawn,lawnLog,false);

            h+='<button class="btn ghost" style="justify-self:start" onclick="openMods(\''+row.a.id+'\')">Adjust products for '+month+'</button>';

      });
      h+='<div class="ototal"><span style="font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)">'+month+' total</span>'+

/* ═══════════ LIBRARY: PRODUCTS ═══════════ */
const PKINDS={"lawn":"Lawn granular","lawn-liquid":"Lawn liquid","bed":"Beds / shrubs","tree":"Trees"};
function PROD(){
  const out={};
  Object.keys(DATA.catalog).forEach(k=>{
    const e=(S.prodEdits||{})[k];
    if(e&&e.removed) return;
    out[k]=e?Object.assign({},DATA.catalog[k],e):DATA.catalog[k];
  });
  (S.prodCustom||[]).forEach(p=>{out[p.code]=p;});
  return out;
}
function P(code){const p=PROD()[code];return p||DATA.catalog[code]||{name:code,unit:"unit",price:0,kind:"lawn",rate:0,unitSize:0,use:""};}
function costPer1k(p){return (p.rate&&p.unitSize)?p.price/p.unitSize*p.rate:0;}
function coverage(p){return (p.rate&&p.unitSize)?Math.round(p.unitSize/p.rate*1000):0;}

function openProd(code){
  confirmDel=false;
  editingProd=code?Object.assign({},P(code),{code:code}):{code:"",name:"",unit:"50 lb bag",price:0,
    kind:"lawn",rate:5,rateUnit:"lbs",unitSize:50,use:"",isNew:true};
  render();
}
function closeProd(){editingProd=null;confirmDel=false;render();}
async function saveProd(){
  const name=val("p_name").trim();
  if(!name){alert("Give the product a name.");return;}
  const rec={name:name,unit:val("p_unit").trim()||"50 lb bag",price:parseFloat(val("p_price"))||0,
    kind:val("p_kind"),cat:val("p_cat")||"FERT",rate:parseFloat(val("p_rate"))||0,rateUnit:val("p_rateunit"),
    unitSize:parseFloat(val("p_unitsize"))||0,use:val("p_use").trim()};
  if(editingProd.isNew){
    let code=name.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)||"PROD";
    while(PROD()[code]) code+="X";
    rec.code=code; S.prodCustom.push(rec);
  }else{
    const builtIn=!!DATA.catalog[editingProd.code];
    if(builtIn) S.prodEdits[editingProd.code]=Object.assign({},S.prodEdits[editingProd.code]||{},rec);
    else{const i=S.prodCustom.findIndex(p=>p.code===editingProd.code); if(i>=0) S.prodCustom[i]=Object.assign({},S.prodCustom[i],rec);}
  }
  editingProd=null; await save();
}
async function deleteProd(code){
  if(DATA.catalog[code]) S.prodEdits[code]=Object.assign({},S.prodEdits[code]||{},{removed:true});
  else S.prodCustom=S.prodCustom.filter(p=>p.code!==code);
  editingProd=null; confirmDel=false; await save();
}
async function restoreProd(code){if(S.prodEdits[code])delete S.prodEdits[code].removed;await save();}

/* ═══════════ LIBRARY: DOCUMENT ARCHIVE ═══════════ */
async function archive(kind,label,meta,snapshot){
  S.docs.unshift({id:"D-"+Date.now(),kind:kind,label:label,month:month,year:year,
    created:new Date().toISOString(),meta:meta,snap:snapshot});
  if(S.docs.length>60) S.docs=S.docs.slice(0,60);
  await save();
}
async function delDoc(id){S.docs=S.docs.filter(d=>d.id!==id);await save();}
function regen(id){
  const d=S.docs.find(x=>x.id===id); if(!d) return;
  if(d.kind==="juan") buildJuanPDF(d.snap,d.month,d.year,d.meta.weekOf,true);
  else buildMonthPDF(d.snap,d.month,d.year,true);
}
function fmtDate(iso){
  const dt=new Date(iso);
  return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+
    " · "+dt.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}

/* ═══════════ MONTH MODS: swap / add treatments per account ═══════════ */
const mk=()=>year+"-"+month;
function modOf(id,m,yr){const key=(yr||year)+"-"+(m||month);return (S.monthMods[key]||{})[id]||null;}
let editingMods=null, modsDraft=null;

function openMods(id){
  const cur=modOf(id)||{};
  const a=findAcc(id);
  modsDraft={id:id,lawn:cur.lawn||"",bed:cur.bed||"",
    extras:(cur.extras||[]).map(x=>({code:x.code,qty:x.qty,note:x.note||""}))};
  editingMods=id; confirmDel=false; render();
}
function closeMods(){editingMods=null;modsDraft=null;render();}
function dSwap(kind,v){if(modsDraft)modsDraft[kind]=v;}
function dExtra(i,f,v){if(modsDraft&&modsDraft.extras[i])modsDraft.extras[i][f]=f==="qty"?(parseFloat(v)||0):v;}
function dAddExtra(){
  if(!modsDraft)return;
  const first=Object.keys(PROD()).filter(c=>P(c).kind!=="tree")[0]||"DIM";
  modsDraft.extras.push({code:first,qty:1,note:""}); render();
}
function dRmExtra(i){if(!modsDraft)return; modsDraft.extras.splice(i,1); render();}
async function saveMods(){
  if(!modsDraft)return;
  const rec={};
  if(modsDraft.lawn) rec.lawn=modsDraft.lawn;
  if(modsDraft.bed) rec.bed=modsDraft.bed;
  const ex=modsDraft.extras.filter(x=>x.code&&x.qty>0);
  if(ex.length) rec.extras=ex;
  S.monthMods[mk()]=S.monthMods[mk()]||{};
  if(Object.keys(rec).length) S.monthMods[mk()][modsDraft.id]=rec;
  else delete S.monthMods[mk()][modsDraft.id];
  if(!Object.keys(S.monthMods[mk()]).length) delete S.monthMods[mk()];
  editingMods=null; modsDraft=null; await save();
}
async function clearMods(){
  if(S.monthMods[mk()]) delete S.monthMods[mk()][editingMods];
  if(S.monthMods[mk()]&&!Object.keys(S.monthMods[mk()]).length) delete S.monthMods[mk()];
  editingMods=null; modsDraft=null; await save();
}

/* ═══════════ HISTORY + FORECAST + STEPS ═══════════ */
function historyRows(){
  const out=[];
  Object.keys(S.logs).forEach(k=>{
    const L=S.logs[k]; if(!L||!L.done) return;
    const parts=k.split("-");                      // year-Month-<id...>-kind
    const yr=parts[0], mo=parts[1], kind=parts[parts.length-1];
    const id=parts.slice(2,parts.length-1).join("-");
    const a=findAcc(id)||DATA.accounts.find(x=>x.id===id)||{name:id,route:"?",day:""};
    let code=null;
    const mod=modOf(id,mo,yr);
    if(kind==="lawn") code=(mod&&mod.lawn)||(DATA.grassCal[a.tier]||{})[mo];
    else if(kind==="bed") code=(mod&&mod.bed)||(DATA.bedCal[a.tier]||{})[mo];
    else if(kind.charAt(0)==="x"){const i=parseInt(kind.slice(1)); code=(mod&&mod.extras&&mod.extras[i])?mod.extras[i].code:null;}
    else code=DATA.treeCal[mo];
    out.push({key:k,date:L.date||"",year:yr,month:mo,acct:a.name,route:a.route,kind:kind,
      code:code,product:code?P(code).name:"—",qty:L.actual||0});
  });
  out.sort((x,y)=>(y.date||"").localeCompare(x.date||""));
  return out;
}
function histTotals(rows){
  const t={};
  rows.forEach(r=>{if(r.code&&r.kind!=="tree") t[r.code]=(t[r.code]||0)+r.qty;});
  return t;
}
function forecastRows(){
  const startIdx=MONTHS.indexOf(month);
  return MONTHS.slice(startIdx).map(m=>{
    const oR=orderRows(m);
    return {month:m,stops:planFor(m).length,cost:oR.reduce((s,r)=>s+r.cost,0),
      units:oR.reduce((s,r)=>s+r.units,0),products:oR};
  }).filter(r=>r.stops>0);
}

async function save2(){

function stepsHTML(code){
  const p=P(code), st=p.steps||{en:[],es:[]};
  if(!st.en.length) return '<div class="fhint">No steps written for this product yet.</div>';
  const both=lang==="both";
  let s='<div class="steps">';
  const n=Math.max(st.en.length,st.es.length);
  for(let i=0;i<n;i++){
    s+='<div class="stepitem"><span class="stepno">'+(i+1)+'</span><span class="steptext">';
    if(lang==="en"||both) s+='<span class="sen">'+esc(st.en[i]||"")+'</span>';
    if(lang==="es"||both) s+='<span class="ses">'+esc(st.es[i]||"")+'</span>';
    s+="</span></div>";
  }
  s+='<div class="safety"><b>'+(lang==="es"?"SEGURIDAD":"SAFETY")+'</b><br>';
  if(lang==="en"||both) s+='<span class="sen">'+esc(DATA.safety.en)+'</span>';
  if(lang==="es"||both) s+='<span class="ses">'+esc(DATA.safety.es)+'</span>';
  s+="</div></div>";
  return s;
}
function langToggle(){
  return '<div class="langbar">'+

function logLine(id,kind,label,planned,log,noQty){
  if(log&&log.done){
    return '<div class="logline done"><span class="loglab g">✓ '+esc(label)+
      (noQty?"":" — "+q(log.actual)+" bag"+(log.actual===1?"":"s"))+" · "+log.date+"</span>"+
      '<button class="btn green" onclick="undoApp(\''+id+'\',\''+kind+'\')">Undo</button></div>';
  }
  const key=lk(id,kind);
  const val=pendingVals[key]!==undefined?pendingVals[key]:planned;
  return '<div class="logline"><span class="loglab">'+esc(label)+"</span>"+
    (noQty?"":'<span class="step"><button class="sbtn" onclick="bump(\''+key+'\','+planned+',-0.5)">−</button>'+
      '<span class="sval tabnum">'+q(val)+'</span>'+
      '<button class="sbtn" onclick="bump(\''+key+'\','+planned+',0.5)">+</button></span>')+
    '<button class="btn orange" onclick="logApp(\''+id+'\',\''+kind+'\','+(noQty?0:val)+')">'+(noQty?"Mark done":"Log it")+"</button></div>";
}
function stepper(id,kind,lab,val,learned){
  return '<span class="astep"><span class="aslab">'+lab+'</span>'+
    '<button class="asbtn" onclick="setBase(\''+id+'\',\''+kind+'\','+((+val)-0.5)+')">−</button>'+

    '<button class="asbtn" onclick="setBase(\''+id+'\',\''+kind+'\','+((+val)+0.5)+')">+</button></span>';
}
